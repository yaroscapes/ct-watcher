name: watch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # watcher.py is paused; restore its "Restore state cache" + "Run"
      # steps from git history to bring it back.

      - name: Restore spa state
        uses: actions/cache/restore@v4
        with:
          path: .spa_state.json
          key: spa-state-${{ github.run_id }}
          restore-keys: |
            spa-state-

      - name: Run spa watcher
        env:
          SPA_CONFIG_JSON: ${{ secrets.SPA_CONFIG_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python spa_watcher.py

      - name: Save spa state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .spa_state.json
          key: spa-state-${{ github.run_id }}

      # Independent of the spa watcher: runs even if a step above failed.
      - name: Restore session state
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: .session_state.json
          key: session-state-${{ github.run_id }}
          restore-keys: |
            session-state-

      - name: Run session watcher
        if: ${{ !cancelled() }}
        env:
          SESSION_CONFIG_JSON: ${{ secrets.SESSION_CONFIG_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python session_watcher.py

      - name: Save session state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .session_state.json
          key: session-state-${{ github.run_id }}
